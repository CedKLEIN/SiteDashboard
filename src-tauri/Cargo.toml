[package]
name = "site-dashboard"
version = "0.1.0"
description = "Tableau de bord local des couts et revenus de mes sites"
authors = ["CedKLEIN"]
edition = "2021"

[lib]
# Le suffixe `_lib` evite un conflit de nom avec le binaire sur Windows.
# Voir https://github.com/rust-lang/cargo/issues/8519
name = "site_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "gzip",
] }
# Inspection des certificats TLS: rustls pour la poignee de main, x509-parser
# pour lire la date d'expiration du certificat presente par le serveur.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["net", "time"] }
x509-parser = "0.17"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
